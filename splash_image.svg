      <path d="M229,297 h22 a4,4 0 0 1 4,4 v10 a4,4 0 0 1 -4,4 h-11 l-7,6 v-6 h-4 a4,4 0 0 1 -4,-4 v-10 a4,4 0 0 1 4,-4z" fill="#ffffff" transform="translate(-4,-3)"/>
      <text x="274" y="300" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff">Lena</text>
      <text x="274" y="324" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#8a93a3">gerade eben</text>
      <rect x="226" y="346" width="228" height="1.5" fill="#232937"/>
      <text font-family="Helvetica, Arial, sans-serif" font-size="27" fill="#ffffff">
        <tspan x="226" y="392">Kommst du heute</tspan>
        <tspan x="226" y="428">Abend noch</tspan>
        <tspan x="226" y="464">vorbei?</tspan>
      </text>
      <rect class="bar" x="226" y="494" width="228" height="4" rx="2" fill="#2f6df6"/>
    </g>
    <rect class="flash" x="206" y="248" width="268" height="326" fill="#8fb4ff" opacity="0"/>
    <path d="M214,252 L374,252 L214,430 Z" fill="#ffffff" opacity="0.05"/>
  </g>

  <g fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M264,530 L254,541 L264,552"/>
    <path d="M330,548 L340,539 L350,548 M333,546 V557 H347 V546"/>
  </g>
  <g fill="#ffffff"><circle cx="432" cy="535" r="2.4"/><circle cx="432" cy="545" r="2.4"/><circle cx="432" cy="555" r="2.4"/></g>
