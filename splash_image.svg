<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 860" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>SW2 Companion – eingehende Nachricht</title>
<desc>Die Uhr vibriert, das Display weckt sich auf und eine Nachricht von Lena gleitet über die Uhrzeit. Ein Balken zeigt die Restzeit, dann kehrt die Uhr zur Zeitanzeige zurück.</desc>
<style>
  .watch{transform-origin:340px 430px;animation:shake 8s linear infinite}
  .time{animation:timeOut 8s ease-in-out infinite}
  .notif{animation:notifIn 8s cubic-bezier(.2,.9,.3,1) infinite}
  .bar{transform-box:fill-box;transform-origin:left center;animation:bar 8s linear infinite}
  .flash{animation:wake 8s ease-out infinite}
  .arc{fill:none;stroke:#2f6df6;stroke-width:5;stroke-linecap:round;opacity:0;animation:buzz 8s ease-in-out infinite}
  .a2{stroke-width:4;animation-delay:.12s}
  .ping{fill:none;stroke:#2f6df6;stroke-width:3;transform-box:fill-box;transform-origin:center;opacity:0;animation:ping 8s ease-out infinite}
  @keyframes shake{
    0%,15%{transform:none}
    16.5%{transform:translateX(-7px) rotate(-.6deg)}
    18%{transform:translateX(7px) rotate(.6deg)}
    19.5%{transform:translateX(-6px) rotate(-.5deg)}
    21%{transform:translateX(6px) rotate(.5deg)}
    22.5%{transform:translateX(-4px) rotate(-.3deg)}
    24%{transform:translateX(4px) rotate(.3deg)}
    25.5%{transform:translateX(-2px)}
    27%,100%{transform:none}
  }
  @keyframes buzz{0%,15%{opacity:0}17%{opacity:.9}20%{opacity:.15}22%{opacity:.9}25%{opacity:.15}27%,100%{opacity:0}}
  @keyframes ping{0%,26%{opacity:0;transform:scale(1)}27%{opacity:.6;transform:scale(1)}38%,100%{opacity:0;transform:scale(1.3)}}
  @keyframes wake{0%,26.5%{opacity:0}28%{opacity:.35}36%,100%{opacity:0}}
  @keyframes timeOut{0%,27%{opacity:1;transform:none}31%,80%{opacity:0;transform:translateY(-24px)}88%,100%{opacity:1;transform:none}}
  @keyframes notifIn{0%,27%{opacity:0;transform:translateY(320px)}33%{opacity:1;transform:translateY(-8px)}35%{opacity:1;transform:none}77%{opacity:1;transform:none}84%,100%{opacity:0;transform:translateY(320px)}}
  @keyframes bar{0%,35%{transform:scaleX(1)}77%,100%{transform:scaleX(0)}}
  @media (prefers-reduced-motion:reduce){
    .watch,.time,.notif,.bar,.flash,.arc,.ping{animation:none}
    .notif,.flash,.arc,.ping{display:none}
  }
</style>
<defs>
  <clipPath id="screen"><rect x="206" y="248" width="268" height="326" rx="16"/></clipPath>
</defs>


<path class="arc a1" d="M168,340 Q150,411 168,482"/>
<path class="arc a2" d="M146,360 Q132,411 146,462"/>
<path class="arc a1" d="M526,340 Q544,411 526,482"/>
<path class="arc a2" d="M548,360 Q562,411 548,462"/>

