  </g>
  <g fill="#0a0a0a">
    <rect x="256" y="624" width="10" height="186"/><rect x="414" y="624" width="10" height="186"/>
  </g>
  <g fill="#2a2a2d">
    <rect x="270" y="636" width="140" height="2"/><rect x="270" y="674" width="140" height="2"/><rect x="270" y="712" width="140" height="2"/><rect x="270" y="750" width="140" height="2"/><rect x="270" y="788" width="140" height="2"/>
  </g>

  <rect x="486" y="384" width="20" height="62" rx="8" fill="#0d0d0d"/>
  <rect x="490" y="392" width="16" height="46" rx="7" fill="#b4b6ba"/>
