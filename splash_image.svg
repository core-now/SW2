  </g>
  <rect x="244" y="206" width="192" height="48" rx="6" fill="#111113"/>
  <rect x="250" y="210" width="180" height="4" rx="2" fill="#2e2e31"/>

  <rect x="252" y="590" width="176" height="230" fill="#0e0e0e"/>
