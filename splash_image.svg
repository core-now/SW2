  <g clip-path="url(#screen)">
    <g class="time">
      <text x="340" y="372" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="124" font-weight="700" fill="#ffffff">10</text>
      <text x="340" y="492" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="124" font-weight="200" fill="#ffffff" stroke="#ffffff" stroke-width="0.8">35</text>
    </g>
    <g class="notif">
      <rect x="206" y="248" width="268" height="326" fill="#0a0e17"/>
